<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Aurelia Voyage & Fleet Management Portal</title>
  <meta name="description" content="Sign in to your Aurelia Customer Voyage Portal or Fleet Operations Command Center. Manage reservations, manifests, and personal voyage itineraries.">
  <meta name="keywords" content="cruise login, guest portal, fleet operations login, voyage portal, sign in">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%2308162B' stroke='%23C5A880' stroke-width='4'/><path d='M30 65 Q50 30 70 65 Q50 55 30 65' fill='%23C5A880'/></svg>">

  <!-- Font Awesome & Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/responsive.css">
</head>
<body style="background-color: var(--color-bg-sand); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div style="width: 100%; max-width: 480px;">
      
      <!-- Go Back Navigation -->
      <div style="margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;">
        <button type="button" onclick="if(window.history.length > 1) { history.back(); } else { window.location.href='index.html'; }" class="go-back-btn" aria-label="Go Back">
          <i class="fa-solid fa-arrow-left"></i> Go Back
        </button>
        <a href="index.html" style="font-size: 0.85rem; color: var(--color-text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-house"></i> Home
        </a>
      </div>

      <!-- Single Card Container -->
      <div class="cruise-card" style="padding: 38px 32px; border-radius: var(--radius-lg); background: #FFFFFF; box-shadow: var(--shadow-lg); border-top: 4px solid var(--color-accent-gold);">
        
        <div style="text-align: center; margin-bottom: 24px;">
          <a href="index.html" aria-label="Return to Homepage" style="display: inline-block; margin-bottom: 14px;">
            <img src="assets/logo.webp" alt="Stackly Logo" style="height: 42px; width: auto; filter: brightness(0);">
          </a>
          <h1 style="font-size: 1.85rem; margin-bottom: 6px; color: #08162B;">Sign In to Aurelia</h1>
          <p style="font-size: 0.92rem; color: var(--color-text-muted);">
            Access your personal voyage itinerary or operations command.
          </p>
        </div>

        <!-- ONLY ONE LOGIN FORM -->
        <form id="loginForm" novalidate>
          
          <!-- 2 ROLES SELECTOR -->
          <div class="form-group" style="margin-bottom: 18px;">
            <label class="form-label" style="margin-bottom: 8px; font-weight: 600;">Select Role (2 Roles Available) <span class="required">*</span></label>
            <div class="role-selector-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <button type="button" class="role-tab-btn active" data-role="customer" id="roleBtnCustomer" style="padding: 12px 14px; border: 1.5px solid var(--color-accent-gold); border-radius: var(--radius-sm); background: rgba(197, 168, 128, 0.1); color: #08162B; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;">
                <i class="fa-solid fa-user" style="color: var(--color-accent-gold);"></i>
                <span>Customer</span>
              </button>
              <button type="button" class="role-tab-btn" data-role="admin" id="roleBtnAdmin" style="padding: 12px 14px; border: 1.5px solid var(--border-subtle); border-radius: var(--radius-sm); background: #FFFFFF; color: var(--color-text-muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Admin</span>
              </button>
            </div>
            <!-- Hidden native select for standard form inspection -->
            <select id="loginRole" name="role" class="form-control" style="display: none;" aria-label="Select Role">
              <option value="customer" selected>Customer</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <!-- Email Field -->
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="loginEmail" class="form-label">Email Address <span class="required">*</span></label>
            <input type="text" id="loginEmail" name="email" class="form-control" placeholder="Enter your email" required autocomplete="username">
            <div class="error-feedback"></div>
          </div>

          <!-- Password Field -->
          <div class="form-group" style="margin-bottom: 18px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label for="loginPassword" class="form-label" style="margin-bottom: 0;">Password <span class="required">*</span></label>
              <a href="404.html" style="font-size: 0.82rem; color: var(--color-accent-azure); text-decoration: none;">Forgot Password?</a>
            </div>
            <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            <div class="error-feedback"></div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 6px; justify-content: center; gap: 8px;">
            <i class="fa-solid fa-right-to-bracket"></i> <span id="submitBtnText">Sign In as Customer</span>
          </button>
        </form>

        <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.88rem; color: var(--color-text-muted);">
          Do not possess an account yet? <a href="signup.html" style="color: var(--color-accent-azure); font-weight: 600;">Create Registration</a>
        </div>
      </div>

      <!-- Navigation & Security Disclosure -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 0.85rem; color: var(--color-text-muted); flex-wrap: wrap; gap: 8px;">
        <button type="button" onclick="if(window.history.length > 1) { history.back(); } else { window.location.href='index.html'; }" style="background: none; border: none; padding: 0; color: var(--color-accent-gold); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 0.85rem;" aria-label="Go Back">
          <i class="fa-solid fa-arrow-left"></i> Go Back
        </button>
        <span>
          <i class="fa-solid fa-shield-halved"></i> Secure Local Session
        </span>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer style="padding: 20px 0; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.8rem; color: var(--color-text-muted); background: #FFFFFF;">
    <div class="container">
      &copy; 2026 stackly all rights reserved.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="assets/main.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
